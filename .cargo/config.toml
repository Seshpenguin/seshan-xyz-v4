[target.'cfg(target_vendor = "rust9x")']
rustflags = [
  '-Ctarget-feature=+crt-static',

  # XP/2003-compatible libs (the v141_xp combo): VC 14.16 CRT + UCRT 10.0.10240 + Platform SDK 7.1A.
  # /LIBPATH is searched before the LIB env var, so these win over the newer libs (still used for host build scripts).
  # Newer VC runtimes (14.4x) import Vista+ APIs like InitializeCriticalSectionEx and won't load on 2003.
  '-Clink-arg=/LIBPATH:C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.16.27023\lib\x64',
  '-Clink-arg=/LIBPATH:C:\Program Files (x86)\Windows Kits\10\Lib\10.0.10240.0\ucrt\x64',
  '-Clink-arg=/LIBPATH:C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A\Lib\x64',
  '-Clink-args=/SUBSYSTEM:CONSOLE,5.02 /OSVERSION:5.2',
]
