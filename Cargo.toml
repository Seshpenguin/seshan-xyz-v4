[package]
name = "seshanxyz_rust9x"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
rust-version = "1.85"
license = "AGPL-3.0"

[dependencies]
rust-cgi = "0.7"
matchit = "0.8"
toml = "0.9"
infer = "0.19"
mime_guess = "2.0.5"
handlebars = "6"
comrak = { version = "0.39.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc_version_runtime = "0.3.0"
os_info = { version = "3.12", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["now"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
